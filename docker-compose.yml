services:  
  qlever:
    image: adfreiburg/qlever:commit-58d19c7
    container_name: ${PROJECT_NAME}_qlever
    entrypoint: ["/init/init-wrapper.sh"]
    environment:
      - ACCESS_TOKEN=${ACCESS_TOKEN}
      - PROJECT_NAME=${PROJECT_NAME}
      - PROJECT_DESCRIPTION=${PROJECT_DESCRIPTION}
    user: "0:0"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "200k"
        max-file: "10"
    volumes:
      - ./entrypoints/qlever:/init
      - ./status:/status
      - ${DATA_MOUNT}:/data
      - ${INDEX_MOUNT}:/index
    
  qlever-ui:
    image: docker.io/adfreiburg/qlever-ui
    container_name: ${PROJECT_NAME}_qlever_ui
    entrypoint: ["/init/init-wrapper.sh"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "200k"
        max-file: "10"
    volumes:
      - ./entrypoints/qlever-ui:/init
      - ./status:/status
      - qlever-ui-db:/app/db

volumes:
  qlever-ui-db: